name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke test
        run: bun run smoke

      - name: Verify templates shipped
        run: bun -e "import { existsSync } from 'node:fs'; const files = ['dist/cli/templates/orchestrator.md', 'dist/cli/templates/patterns/long-proof.md', 'dist/cli/templates/commands/teamwork.md', 'dist/cli/templates/prompts/orchestrator.txt']; for (const f of files) { if (!existsSync(f)) { console.error('Missing: ' + f); process.exit(1); } }"
