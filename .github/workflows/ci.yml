name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (engine, event log, config injection, guards)
        run: bun test

      - name: Build
        run: bun run build

      - name: Engine end-to-end (real git worktrees, real evidence capture)
        run: bun run e2e

      - name: Plugin integration (built bundle, real hook shapes)
        run: bun run integration

      - name: Installer smoke test
        run: bun run smoke

      - name: Verify templates and engine modules shipped
        shell: bash
        run: |
          for f in \
            dist/cli/templates/sentinel.md \
            dist/cli/templates/patterns/long-proof.md \
            dist/cli/templates/commands/teamwork.md \
            dist/cli/templates/prompts/sentinel.txt \
            dist/engine.js \
            dist/events.js \
            dist/policy.js ; do
            if [ ! -f "$f" ]; then echo "Missing: $f"; exit 1; fi
          done
          echo "all expected build outputs present"

  pack-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build and pack
        run: bun run build && npm pack

      - name: Install the packed tarball into a clean project
        shell: bash
        run: |
          mkdir -p /tmp/packtest && cd /tmp/packtest
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/opencode-teamwork-*.tgz >/dev/null
          test -f node_modules/opencode-teamwork/dist/engine.js
          test -f node_modules/opencode-teamwork/dist/cli/templates/patterns/long-proof.md
          test -f node_modules/opencode-teamwork/SKILL.md
          node -e "const p=require('./node_modules/opencode-teamwork/package.json');console.log('packed package ok:',p.version);if(!p.files.includes('SKILL.md'))process.exit(1)"
