name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke test
        run: |
          node dist/cli/index.js install --print | tee /tmp/install-dry.json
          node -e "const j = require('/tmp/install-dry.json'); if (!j.plugin.includes('opencode-team@latest')) process.exit(1);"

      - name: Verify templates shipped
        run: |
          test -f dist/cli/templates/orchestrator.md
          test -f dist/cli/templates/patterns/long-proof.md
          test -f dist/cli/templates/commands/teamwork.md
          test -f dist/cli/templates/prompts/orchestrator.txt
